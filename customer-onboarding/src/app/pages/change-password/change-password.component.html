<section class="mx-auto max-w-2xl space-y-6">
  <div>
    <p class="section-eyebrow">Security update</p>
    <h1 class="section-title">Change password</h1>
    <p class="section-copy">Update your password regularly to keep operator access secure.</p>
  </div>

  <div *ngIf="pageError" class="alert-danger">{{ pageError }}</div>

  <div class="panel-card">
    <form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()">
      <div>
        <label class="field-label">Current password</label>
        <input class="input-field" type="password" formControlName="currentPassword" placeholder="Enter current password" />
      </div>
      <div>
        <label class="field-label">New password</label>
        <input class="input-field" type="password" formControlName="newPassword" placeholder="At least 8 characters" />
      </div>
      <div>
        <label class="field-label">Confirm new password</label>
        <input class="input-field" type="password" formControlName="confirmPassword" placeholder="Re-enter new password" />
      </div>
      <div class="pt-2">
        <button class="btn-primary" type="submit" [disabled]="submitting">
          {{ submitting ? 'Updating...' : 'Update password' }}
        </button>
      </div>
    </form>
  </div>
</section>
