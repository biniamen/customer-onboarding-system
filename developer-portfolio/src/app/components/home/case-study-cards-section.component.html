<section class="section">
  <div class="container">
    <div class="section-header">
      <div>
        <p class="eyebrow">Selected work</p>
        <h2 class="section-heading">Engagements measured by outcomes, not activity.</h2>
      </div>
      <a class="button-secondary" routerLink="/work">View full case studies</a>
    </div>

    <div class="case-study-grid">
      <article class="panel case-study-card" *ngFor="let study of caseStudies">
        <div class="case-study-card__icon" [ngSwitch]="study.icon" aria-hidden="true">
          <span *ngSwitchCase="'identity'">ID</span>
          <span *ngSwitchCase="'payments'">PAY</span>
          <span *ngSwitchDefault>API</span>
        </div>
        <p class="case-study-card__client">{{ study.client }}</p>
        <h3>{{ study.title }}</h3>
        <p class="case-study-card__summary">{{ study.summary }}</p>
        <div class="case-study-card__metrics">
          <span *ngFor="let metric of study.metrics">{{ metric }}</span>
        </div>
      </article>
    </div>
  </div>
</section>
