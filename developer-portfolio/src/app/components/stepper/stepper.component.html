<ol class="space-y-4">
  <li *ngFor="let step of steps; let index = index" class="flex items-start gap-4">
    <div
      class="flex h-10 w-10 items-center justify-center rounded-2xl border text-sm font-bold transition"
      [ngClass]="{
        'border-accent-300 bg-accent-500 text-white': isComplete(step.route),
        'border-brand-200 bg-brand-50 text-brand-700': isActive(step.route),
        'border-white/15 bg-white/5 text-slate-300': !isActive(step.route) && !isComplete(step.route)
      }"
    >
      <span *ngIf="!isComplete(step.route)">{{ index + 1 }}</span>
      <span *ngIf="isComplete(step.route)">&#10003;</span>
    </div>
    <div class="pt-1">
      <p class="text-sm font-semibold" [ngClass]="{ 'text-white': isActive(step.route) || isComplete(step.route), 'text-slate-400': !isActive(step.route) && !isComplete(step.route) }">
        {{ step.label }}
      </p>
      <p class="mt-1 text-xs uppercase tracking-[0.25em]" [ngClass]="{ 'text-brand-200': isActive(step.route), 'text-accent-200': isComplete(step.route), 'text-slate-500': !isActive(step.route) && !isComplete(step.route) }">
        {{ isComplete(step.route) ? 'Completed' : isActive(step.route) ? 'In progress' : 'Pending' }}
      </p>
    </div>
  </li>
</ol>
